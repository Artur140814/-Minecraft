<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./css/normolize.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="icon" href="./favicon/favicon.svg" type="image/x-icon">
    <link rel="icon" href="./favicon/favicon.svg" type="image/png" sizes="32x32">
    <link rel="icon" href="./favicon/favicon.svg" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="./favicon/favicon.svg" sizes="180x180">
</head>
<body>
    <header class="header">
        <a class="logo" href="index.html">
            <img class="logo__picture" src="./pictures/logo.svg" alt="logo">
            <span>
                <span class="logo__text">LUSH</span>
                <span class="logo__text logo__text--color">CRAFT</span>
            </span>
        </a>
        <nav class="menu">
            <ul class="menu__list">
                <li class="menu__item">
                    <a href="" class="anchor-link anchor-link--active">Главная</a>
                </li>
                <li class="menu__item">
                    <a href="./pages/about-game.html" class="anchor-link">Об игре</a>
                </li>
                <li class="menu__item">
                    <a href="" class="anchor-link">Ресурсы</a>
                </li>
            </ul>
        </nav>
        <div class="menu__backdrop"></div>
        <button class="burger">
            <span class="burger__line"></span>
        </button>
    </header>
    <main>
        <section class="hero">
            <div class="brow">
                <span class="brow__line"></span>
                <p class="brow__text">ДОБРО ПОЖАЛОВАТЬ ПОД ЗЕМЛЮ</p>
            </div>

            <p class="hero__description">Исследуй пышные пещеры, собирай редкие ресурсы и создавай свой мир среди мха, кристаллов и древнего камня.</p>
            <div class="hero__wrapper-button">
                <a href="" class="info-link">
                    <span class="info-link__text">НАЧАТЬ ПУТЬ</span>
                    <span class="info-link__icon"></span>
                </a>
                <a href="" class="resource-link"></a>

    <script src="./JS/mobile-menu.js"></script>
